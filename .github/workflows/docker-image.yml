name: Docker image CI

on:
  push:
    branches: [ main, feat/dockerfile-alpine-latest ]
  pull_request:
    branches: [ main, feat/dockerfile-alpine-latest ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch, optional)
        uses: docker/setup-qemu-action@v3
        if: ${{ := github.events.pull_request.pull_request head_ref != '' }}

      - name: Build Docker image
        run: |
          docker build -t docker-crontab-test:ci .

      - name: Run test script
        run: |
          bash tests/docker-test.sh docker-crontab-test:ci
