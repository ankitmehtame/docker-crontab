name: Docker image CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t docker-crontab-test:ci .

      - name: Run test script
        run: |
          bash tests/docker-test.sh docker-crontab-test:ci
